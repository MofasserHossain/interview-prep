"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"
file_include_globs = ".env\n.env.local\n.env.*.local\n"

[scripts]
archive = "bash ./.conductor/archive.sh"
setup = "bash ./.conductor/setup.sh"
run_mode = "concurrent"

[[preview_urls]]
name = "Interview Prep"
url = "http://localhost:$CONDUCTOR_PORT"

[scripts.run.web]
available_in = ["local", "cloud"]
command = "bash ./.conductor/run.sh web"
default = true
icon = "play"

[scripts.run.check]
available_in = ["local", "cloud"]
command = "bash ./.conductor/run.sh check"
icon = "test-tube"

[scripts.run.build]
available_in = ["local", "cloud"]
command = "bash ./.conductor/run.sh build"
icon = "package-check"
